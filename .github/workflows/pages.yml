name: Publish test catalog

# For a fork used as a custom catalog. Builds the static API from apps/*.json and publishes it
# to GitHub Pages, UNSIGNED (the store must have "Verify custom catalog signatures" switched off).
# Action versions are the same pinned commits the original ci.yml uses.
#
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
# Custom catalog URL for the store:
#   project repo  -> https://<owner>.github.io/<repo>/api/v1/
#   <owner>.github.io repo -> https://<owner>.github.io/api/v1/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWNER: ${{ github.repository_owner }}
      REPOSITORY: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the manifest's sequence number counts commits
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - run: python3 -m catalog check
      # Icons and release facts (size, date, content version) are fetched once per app and reused
      # by later builds, as in the original ci.yml; with ~100 apps the first build is the slow one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .icon-cache
          key: icons-${{ hashFiles('apps/*.json') }}
          restore-keys: icons-
      - name: Work out the site address
        # A project site lives under /<repo>/; the build nests its output in that folder, and
        # the icon addresses inside the API files must name the same path.
        run: |
          owner="${OWNER,,}"
          echo "SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          if [[ "${REPOSITORY,,}" == "${owner}.github.io" ]]; then
            echo "BASE=/" >> "$GITHUB_ENV"
            echo "PUBLISH_DIR=site-build" >> "$GITHUB_ENV"
          else
            echo "BASE=/${REPOSITORY}/" >> "$GITHUB_ENV"
            echo "PUBLISH_DIR=site-build/${REPOSITORY}" >> "$GITHUB_ENV"
          fi
      - name: Build the website and API
        run: >-
          python3 -m catalog build --out site-build --icon-cache .icon-cache
          --site-url "$SITE_URL" --base "$BASE"
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read-only: raises the rate limit for release facts
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
